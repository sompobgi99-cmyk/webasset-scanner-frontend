name: Staging Write E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

concurrency:
  group: staging-write-e2e
  cancel-in-progress: false

jobs:
  staging-write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      ITAM_STAGING_FRONTEND_URL: https://sompobgi99-cmyk.github.io/webasset-scanner-frontend/staging/
      ITAM_STAGING_GAS_API_URL: https://script.google.com/macros/s/AKfycbwiSgyrenecigwM_vWGskOBW89VHANt8qDR03ABk0_rs_caS_pBPL5kgdrmZXpSpcl9/exec
      ITAM_STAGING_USERNAME: ${{ secrets.ITAM_STAGING_USERNAME }}
      ITAM_STAGING_PASSWORD: ${{ secrets.ITAM_STAGING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:staging-write
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-write-e2e-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
